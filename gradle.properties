# ========== GRADLE DAEMON ==========
org.gradle.daemon=true
org.gradle.jvmargs=-Xmx12g -XX:MaxMetaspaceSize=4g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8 -XX:+UseG1GC -XX:MaxGCPauseMillis=500
org.gradle.parallel=true
org.gradle.workers.max=6
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn
org.gradle.configureondemand=true
# ========== KOTLIN ==========
kotlin.caching.enabled=true
kotlin.incremental=true
kotlin.incremental.java=true
kotlin.parallel.tasks.in.project=true
kotlin.daemon.jvm.options="-Xmx8g"
# ========== KSP ==========
ksp.incremental=true
ksp.use.worker.api=true
ksp.workers.max=6
ksp.workers.max.heap.size=4096
# ========== DEX OPTIMIZATIONS ==========
android.dexOptions.enableDexingArtifactTransform=true
android.dexOptions.useDexingCache=true
android.experimental.enableDexingArtifactTransform=true
# ========== ANDROID BUILD ==========
android.useAndroidX=true
android.nonTransitiveRClass=true
android.enableJetifier=false
android.enableResourceOptimizations=true
android.parallel.resourceProcessing=true
android.aapt2.prefetchResources=true
android.r8.fastGeneration.enabled=true
android.bundle.resources.optimization=true
# ========== AGP 9.0 ==========
android.builtInKotlin=true
android.newDsl=true
android.usesSdkInManifest.disallowed=true
android.sdk.defaultTargetSdkToCompileSdkIfUnset=true
android.r8.optimizedResourceShrinking=true
android.nonFinalResIds=true
# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
