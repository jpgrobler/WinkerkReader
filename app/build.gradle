plugins {
    id 'com.android.application'
    id 'com.google.devtools.ksp' version '2.3.9'
}

def espressoCoreVersion = '3.7.0'

android {
    compileSdk = 37
    defaultConfig {
        applicationId = "za.co.jpsoft.winkerkreader"
        minSdk = 26
        versionCode = 116
        versionName = "4.2 test r016"
        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
        targetSdk = 35
        vectorDrawables.useSupportLibrary = true

        // ✅ Add BuildConfig fields if you use them
        buildConfigField "String", "BUILD_TIME", "\"${System.currentTimeMillis()}\""
        // Add any other BuildConfig fields you need
    }

    aaptOptions {
        noCompress = ['png', 'webp', 'jpg', 'jpeg']
        cruncherEnabled = false
        cruncherProcesses = 4
    }

    buildFeatures {
        viewBinding = true
        dataBinding = true
        buildConfig = true  // ✅ CRITICAL FIX
    }

    viewBinding {
        enabled = true
    }

    signingConfigs {
        release {
            storeFile = file(RELEASE_STORE_FILE)
            storePassword = RELEASE_STORE_PASSWORD
            keyAlias = RELEASE_KEY_ALIAS
            keyPassword = RELEASE_KEY_PASSWORD
        }
    }

    sourceSets {
        main {
            assets.srcDirs = ['src/main/assets']
        }
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.release
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            jniDebuggable = true
            minifyEnabled = false
            shrinkResources = false
            crunchPngs = false
            debuggable = true
            testCoverageEnabled = false
            pseudoLocalesEnabled false
            zipAlignEnabled false
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled = true
    }

    tasks.withType(JavaCompile).configureEach {
        options.compilerArgs << "-Xlint:deprecation"
    }

    testOptions {
        unitTests.includeAndroidResources = true
    }

    packagingOptions {
        jniLibs {
            excludes += ['META-INF/*', 'META-INF/licenses/*']
        }
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE', 'META-INF/LICENSE.txt', 'META-INF/NOTICE', 'META-INF/NOTICE.txt']
        }
    }

    namespace = 'za.co.jpsoft.winkerkreader'

    dependenciesInfo {
        includeInApk = false
        includeInBundle = false
    }
}


dependencies {
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'
    implementation 'androidx.lifecycle:lifecycle-process:2.11.0'
    implementation 'androidx.paging:paging-common:3.5.0'
    implementation "androidx.paging:paging-runtime-ktx:3.5.0"
    implementation("androidx.biometric:biometric:1.1.0")
    implementation "androidx.core:core-ktx:1.19.0"
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.2.0'
    implementation 'com.google.android.libraries.places:places:5.2.0'
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0"
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.11.0'

    // ========== CORE ANDROID LIBRARIES ==========
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.activity:activity-ktx:1.13.0'
    implementation 'androidx.localbroadcastmanager:localbroadcastmanager:1.1.0'
    implementation 'androidx.fragment:fragment-ktx:1.8.9'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'

    // ========== LIFECYCLE COMPONENTS ==========
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:2.11.0"
    implementation "androidx.lifecycle:lifecycle-viewmodel-savedstate:2.11.0"
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.11.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.11.0'
    implementation 'androidx.lifecycle:lifecycle-common-java8:2.11.0'
    implementation 'androidx.lifecycle:lifecycle-service:2.11.0'

    // ========== NAVIGATION COMPONENTS ==========
    implementation "androidx.navigation:navigation-fragment-ktx:2.9.8"
    implementation "androidx.navigation:navigation-ui-ktx:2.9.8"

    // ========== RECYCLER VIEW ==========
    implementation 'androidx.recyclerview:recyclerview:1.4.0'

    // ========== ROOM DATABASE ==========
    def room_version = "2.8.4"
    implementation "androidx.room:room-runtime:$room_version"
    implementation "androidx.room:room-ktx:$room_version"
    ksp "androidx.room:room-compiler:$room_version"  // kapt → ksp

    // ========== WORK MANAGER ==========
    implementation 'androidx.work:work-runtime-ktx:2.11.2'

    // ========== PREFERENCES ==========
    implementation 'androidx.preference:preference-ktx:1.2.1'

    // ========== SECURITY ==========
    implementation 'androidx.security:security-crypto:1.1.0'

    // ========== THIRD PARTY LIBRARIES ==========
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation 'com.readystatesoftware.sqliteasset:sqliteassethelper:2.0.1'
    implementation 'com.github.yukuku:ambilwarna:2.0.1'
    implementation 'com.googlecode.ez-vcard:ez-vcard:0.12.2'
    implementation 'com.github.bumptech.glide:glide:5.0.7'
    ksp 'com.github.bumptech.glide:ksp:5.0.7'
    implementation 'com.google.code.gson:gson:2.14.0'
    implementation 'com.squareup.okhttp3:okhttp:5.4.0'
    implementation 'com.squareup.retrofit2:retrofit:3.0.0'
    implementation 'com.squareup.retrofit2:converter-gson:3.0.0'
    implementation 'pub.devrel:easypermissions:3.0.0'

    // ========== DEBUG ==========
    implementation 'com.squareup.leakcanary:leakcanary-android:2.14'
    // ========== TESTING ==========
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.mockito:mockito-core:5.23.0'
    testImplementation 'androidx.arch.core:core-testing:2.2.0'
    testImplementation "androidx.room:room-testing:$room_version"
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.11.0'

    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation "androidx.test.espresso:espresso-core:$espressoCoreVersion"
    androidTestImplementation 'androidx.test.espresso:espresso-intents:3.7.0'
    androidTestImplementation 'androidx.test.espresso:espresso-accessibility:3.7.0'
    androidTestImplementation 'androidx.work:work-testing:2.11.2'
    androidTestImplementation 'androidx.test:rules:1.7.0'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test.uiautomator:uiautomator:2.4.0'
    // ========== DESUGARING ==========
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
}

ksp {
    arg("room.schemaLocation", "$projectDir/schemas")
    arg("room.verifier.enabled", "false")
    arg("room.exportSchema", "false")
}